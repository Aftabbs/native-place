name: Special-train notices

# Every morning, look at each zonal railway's press releases for festival-special notices
# not yet in data/specials/seen-notices.json, and keep one issue listing them. A person
# reads each notice and adds its trains to specials-2026.csv; nothing is transcribed here.

on:
  schedule:
    - cron: "0 1 * * *" # 06:30 India time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download each zone's press-release index
        run: |
          mkdir -p /tmp/zones
          cd pipeline
          for zone in $(python -c "from ghar.watch_specials import ZONES; print(' '.join(ZONES))"); do
            url=$(python -c "from ghar.watch_specials import index_url; print(index_url('$zone'))")
            curl -sS -m 60 -A "Mozilla/5.0" -o "/tmp/zones/$zone.html" "$url" || echo "::warning::$zone index could not be fetched"
          done
      - name: Keep the issue up to date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pipeline
          python -m ghar.watch_specials /tmp/zones > /tmp/new.md
          title="New special-train notices to check"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ ! -s /tmp/new.md ]; then
            echo "No new notices."
            exit 0
          fi
          {
            echo "Festival-special notices on the zonal railway sites that are not yet in the data."
            echo "Read each one, add its trains to \`data/specials/specials-2026.csv\`, then run"
            echo "\`python -m ghar.watch_specials <folder> --record\` and close this issue."
            echo
            cat /tmp/new.md
          } > /tmp/body.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file /tmp/body.md
          else
            gh issue create --title "$title" --body-file /tmp/body.md
          fi
